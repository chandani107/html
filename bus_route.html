<html>

<head>
    <title>Bus Route</title>
</head>

<body>
    <form action="success.html">
        <table border="1" cellpadding="10" width="100%" bgcolor="caf0f8">
            <tr>
                <td>
                    <label for="source">
                        <font  size="5">source</font>
                    </label>
                    <br>
                    <input type="text" name="source" id="source">
                </td>
                <td>
                    <label for="destination">
                        <font  size="5">Destination</font>
                    </label>
                    <br>
                    <input type="text" name="Destination" id="Destination">
                </td>
                <td>
                    <label for="journeydate">
                        <font  size="5">date</font>
                    </label>
                    <br>
                    <input type="date" name="journeydate" id="journeydate">
                </td>
                <td>
                    <label for="">seats</label>
                    <br>
                    <select name="seat" id="seat">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </td>
                <td>
                    <label for="">bus type</label>
                    <br>
                    <label for="express">
                        <input type="checkbox" name="express" id="express">Express
                    </label>
                    <br>
                    <label for="ac">
                        <input type="checkbox" name="ac" id="ac">AC
                    </label>
                    <br>
                    <label for="Volvo">
                        <input type="checkbox" name="Volvo" id="Volvo">Volvo
                    </label>
                    <br>
                    <label for="Sleeper">
                        <input type="checkbox" name="Sleeper" id="Sleeper">Sleeper
                    </label>
                </td>
                <td>
                    <label for="">select Gender</label>
                    <br><label for="male">
                        <input type="radio" name="Gender" id="male">male
                    </label>
                    <br>
                    <label for="Female">
                        <input type="radio" name="Gender" id="Female">Female
                    </label>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
