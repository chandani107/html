<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>min max</title>
</head>

<body>
    <form action="success.html">
        <table border="1" cellpadding="10" width="100%" bgcolor="#caf0f8">
            <tr>
                <td>
                    <label for="source">Source</label>
                    <input type="text" name="source" id="source" required>
                </td>
                <td>
                    <label for="destination">Destination</label>
                    <input type="text" name="Destination" id="Destination">
                </td>
                <td>
                    <label for="journeydate">Date</label>
                    <input type="date" name="journeydate" id="journeydate" required min="2026-07-26" max="2026-10-25">
                </td>
                <td>
                    <label for="seats">Seats</label>
                    <input type="number" name="seats" id="seats" min="1" max="5" required>
                </td>
                <td>
                    <label for="">Bus type</label>
                    <br>
                    <label for="express">
                        <input type="checkbox" name="express" id="express" value="1" >Express
                    </label>
                    <br>
                    <label for="ac">
                        <input type="checkbox" name="ac" id="ac" value="2"> Ac
                    </label>
                    <br>
                    <label for="volvo">
                        <input type="checkbox" name="volvo" id="volvo" value="3">volvo
                    </label>
                    <br>
                    <label for="sleeper">
                        <input type="checkbox" name="sleeper" id="sleeper" value="4">sleeper
                    </label>
                </td>
                <td>
                    <label for="">Select Gender</label>
                    <br>
                    <label for="male">
                        <input type="radio" id="male" name="Gender">Male
                    </label> <label for="female">
                        <br>
                        <input type="radio" id="frmale" name="Gender">Female
                    </label>
                </td>
                <td>
                    <input type="submit" value="search">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
